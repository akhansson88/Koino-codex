<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width">
<title>{{SUBJECT}}</title>
</head>
<body style="margin:0;padding:0;background-color:#F3EDE2;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{PREVIEW}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F3EDE2;">
  <tr>
    <td align="center" style="padding:44px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#FFFCF6;border:1px solid #E9DFCF;border-radius:26px;">
        <tr>
          <td style="padding:38px 40px 0 40px;text-align:center;">
            <div style="font-family:Georgia,'Times New Roman',serif;font-size:19px;letter-spacing:9px;color:#14120F;">KOINO</div>
            <div style="margin:20px auto 0 auto;width:46px;height:2px;background-color:#C2542F;border-radius:2px;font-size:0;line-height:0;">&nbsp;</div>
          </td>
        </tr>
        <tr>
          <td style="padding:34px 40px 0 40px;">
            <h1 style="margin:0;font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:31px;line-height:39px;color:#14120F;letter-spacing:-0.4px;">{{HEADING}}</h1>
            <p style="margin:18px 0 0 0;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;color:#4A463E;">{{INTRO_HTML}}</p>
            <p style="margin:10px 0 0 0;font-family:Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;color:#4A463E;">{{INTRO2}}</p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:30px 40px 0 40px;">
            <a href="%LINK%" style="display:inline-block;background-color:#151310;color:#FBF7EF;text-decoration:none;font-family:Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;padding:17px 36px;border-radius:15px;">{{BUTTON}}</a>
            <div style="margin-top:16px;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:19px;color:#8A8377;">{{LINK_HINT}}<br><a href="%LINK%" style="color:#A6502F;text-decoration:underline;word-break:break-all;">%LINK%</a></div>
          </td>
        </tr>
        <tr>
          <td style="padding:32px 40px 0 40px;"><div style="height:1px;background-color:#ECE3D5;font-size:0;line-height:0;">&nbsp;</div></td>
        </tr>
        <tr>
          <td style="padding:22px 40px 36px 40px;">
            <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:21px;color:#8A8377;">{{IGNORE}}</p>
            <p style="margin:16px 0 0 0;font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:19px;color:#B0A79A;letter-spacing:0.2px;">{{BRAND}}</p>
          </td>
        </tr>
      </table>
      <div style="max-width:560px;margin:20px auto 0 auto;font-family:Helvetica,Arial,sans-serif;font-size:11px;line-height:18px;color:#A79E90;text-align:center;">{{REASON_HTML}}</div>
    </td>
  </tr>
</table>
</body>
</html>
