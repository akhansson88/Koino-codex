[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/bible-topic"
  to = "/.netlify/functions/bible-topic"
  status = 200

[[redirects]]
  from = "/api/donations/checkout"
  to = "/.netlify/functions/donation-checkout"
  status = 200

[[redirects]]
  from = "/api/donations/verify"
  to = "/.netlify/functions/donation-verify"
  status = 200

[[redirects]]
  from = "/api/donations/portal"
  to = "/.netlify/functions/donation-portal"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
