const WORD_RE=/[\p{L}][\p{L}’'-]{4,}/gu;
function clozeQuestion(pool,used){let candidates=pool.filter(v=>!used.has(idFor(v))&&verseLength(v)>=50&&verseLength(v)<=180&&(v.text.match(WORD_RE)||[]).length>=6);if(!candidates.length)return choiceQuestion(pool,used);let v=rand(candidates);used.add(idFor(v));let matches=[...v.text.matchAll(WORD_RE)].filter(m=>!['HERREN','HERRENS','denna','detta','skulle','deras','honom','henne','vilket','vilken'].includes(m[0]));if(!matches.length)return choiceQuestion(pool,used);let match=rand(matches);let word=match[0];let candidatesWords=shuffle(pool.flatMap(x=>(x.text.match(WORD_RE)||[])).filter(w=>w.toLocaleLowerCase('sv')!==word.toLocaleLowerCase('sv')&&Math.abs(w.length-word.length)<=3));let distinct=[];for(let w of candidatesWords){if(!distinct.some(x=>x.toLocaleLowerCase('sv')===w.toLocaleLowerCase('sv')))distinct.push(w);if(distinct.length===3)break}if(distinct.length<3){for(let other of all.slice(0,400)){for(let w of other.text.match(WORD_RE)||[]){if(w.toLocaleLowerCase('sv')!==word.toLocaleLowerCase('sv')&&!distinct.some(x=>x.toLocaleLowerCase('sv')===w.toLocaleLowerCase('sv')))distinct.push(w);if(distinct.length>=3)break}if(distinct.length>=3)break}}let options=shuffle([word,...distinct.slice(0,3)]).map(x=>({label:x,correct:x===word}));return{type:'cloze',title:'Vilket ord saknas i versen?',verse:v,passage:v.text.slice(0,match.index)+'______'+v.text.slice(match.index+word.length),maskedIndex:match.index,maskedWord:word,options,answer:options.findIndex(o=>o.correct)}}
function continuationQuestion(pool,used){let candidates=pool.filter(v=>!used.has(idFor(v))&&verseLength(v)>=25&&verseLength(v)<=150&&findVerse(v.book,v.chapter,v.number+1)&&verseLength(findVerse(v.book,v.chapter,v.number+1))<=190&&verseLength(findVerse(v.book,v.chapter,v.number+1))>=25);if(!candidates.length)return choiceQuestion(pool,used);let v=rand(candidates),target=findVerse(v.book,v.chapter,v.number+1);used.add(idFor(v));used.add(idFor(target));let candidatesForChoices=shuffle(pool.filter(x=>x.book===v.book&&x.chapter===v.chapter&&x.number!==target.number&&x.number!==v.number&&x.text!==target.text&&verseLength(x)>=25&&verseLength(x)<=190));candidatesForChoices.push(...shuffle(all.filter(x=>x.book!==v.book&&x.text!==target.text&&verseLength(x)>=25&&verseLength(x)<=190)));let decoys=[],seenText=new Set([target.text]);for(let x of candidatesForChoices){if(!seenText.has(x.text)){decoys.push(x);seenText.add(x.text)}if(decoys.length===3)break}let options=shuffle([target,...decoys]).map(x=>({label:x.text,correct:idFor(x)===idFor(target)}));return{type:'next',title:'Vilken vers kommer direkt efter?',verse:target,previous:v,passage:v.text,options,answer:options.findIndex(o=>o.correct)}}
function buildQuestion(pool,used){let candidates=pool.filter(v=>!used.has(idFor(v))&&v.text.split(/\s+/).length>=9&&v.text.split(/\s+/).length<=23&&verseLength(v)<180);if(!candidates.length)return choiceQuestion(pool,used);let v=rand(candidates);used.add(idFor(v));let tokens=v.text.match(/\S+\s*/g)||[];let parts=[];let size=Math.ceil(tokens.length/4);for(let i=0;i<tokens.length;i+=size)parts.push(tokens.slice(i,i+size).join(''));if(parts.length<3)return choiceQuestion(pool,used);let tiles=shuffle(parts.map((text,i)=>({text,id:i})));if(tiles.every((x,i)=>x.id===i))tiles.reverse();return{type:'builder',title:'Sätt versens delar i rätt ordning',verse:v,tiles,answer:parts.map((_,i)=>i)}}
function makeQuestions(pool){const seen=new Set(),types=['reference','cloze','next','builder','reference','next','cloze','builder'];let questions=[];for(let type of types){let q=({reference:choiceQuestion,cloze:clozeQuestion,next:continuationQuestion,builder:buildQuestion}[type])(pool,seen);if(q)questions.push(q)}return questions}
function startSession(mode,id){let pool,mission=null,book=null;if(mode==='mission'||mode==='daily'){mission=MISSIONS.find(m=>m.id===id);if(!mission)return;pool=missionPool(mission)}else{book=books[Number(id)-1];if(!book)return;pool=chaptersByBook[Number(id)-1].chapters.flatMap(c=>c.verses)}const questions=makeQuestions(pool);if(!questions.length)return;ui.session={mode,id,mission,book,questions,index:0,correct:0,hearts:4,runXp:0,streak:0,answered:false,selected:null,tilesChosen:[],history:[]};ui.view='play';render();scrollTo(0,0)}
function daily(){const d=today().split('-').reduce((s,x)=>s+Number(x),0);let m=MISSIONS[d%MISSIONS.length];startSession('daily',m.id)}
function game(){let s=ui.session;if(!s)return journey();let q=s.questions[s.index];if(!q)return summary();const typeLabel={reference:'HITTA VERSEN',cloze:'FYLL I ORDET',next:'VAD HÄNDER SEDAN?',builder:'BYGG VERSEN'}[q.type];const text=q.type==='builder'?'<div class="builder-prompt">Tryck på textdelarna i rätt ordning. Den ursprungliga versen visas oförändrad efter svaret.</div>':`<div class="passage">${esc(q.passage)}${q.type==='next'?`<small>${esc(ref(q.previous))} · Följande vers efterfrågas.</small>`:q.type==='cloze'?'<small>Övningsvy med lucka — full originaltext visas i facit.</small>':'<small>Citat direkt ur Reformationsbibeln 2016</small>'}</div>`;let options=q.type==='builder'?`<div class="builder-slot">${s.tilesChosen.length?s.tilesChosen.map(i=>`<button class="word-chip selected" data-action="unbuild" data-value="${i}" ${s.answered?'disabled':''}>${esc(q.tiles[i].text.trim())}</button>`).join(''):'<span>Tryck på första textdelen nedan …</span>'}</div><div class="builder-controls">${q.tiles.map((x,i)=>`<button class="word-chip ${s.tilesChosen.includes(i)?'used':''}" data-action="build" data-value="${i}" ${s.answered?'disabled':''}>${esc(x.text.trim())}</button>`).join('')}</div><button class="btn ghost sm" data-action="resetbuild" ${s.answered?'disabled':''}>Börja om</button> <button class="btn sm" data-action="checkbuild" ${s.answered||s.tilesChosen.length!==q.tiles.length?'disabled':''}>Kontrollera svaret</button>`:`<div class="options">${q.options.map((x,i)=>`<button class="option ${s.answered?(i===q.answer?'correct':i===s.selected?'wrong':'dim'):''} ${q.type==='next'?'long':''}" data-action="answer" data-value="${i}" ${s.answered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(x.label)}</span></button>`).join('')}</div>`;return `<div class="game-wrap"><div class="game-head"><button class="link-btn" data-action="quit">← Avsluta</button><span class="muted" style="font-size:12px">${esc(s.mission?.title||s.book?.name)} · Fråga ${s.index+1} av ${s.questions.length}</span></div><div class="quiz-progress">${s.questions.map((x,i)=>`<span class="${i<s.index?'done':i===s.index?'active':''}"></span>`).join('')}</div><div class="question-card"><div class="q-badge">✦ ${typeLabel}</div><h2>${esc(q.title)}</h2>${text}${options}${s.answered?`<div class="feedback ${s.history.at(-1)?.correct?'':'error'}" aria-live="polite"><h3>${s.history.at(-1)?.correct?'✓ Rätt svar!':'✧ Fortsätt att lära — här är originalversen'}</h3><p class="original">${esc(q.verse.text)}</p><div class="cite">${esc(ref(q.verse))}</div>${footnoteHTML(q.verse)}<p>Detta facit är hämtat direkt från bibelfilens text och hänvisning.</p><button class="link-btn" data-action="bookmark" data-value="${idFor(q.verse)}">${state.bookmarks[idFor(q.verse)]?'★ Sparad som minneskort':'☆ Spara som minneskort'}</button></div>`:''}<div class="quiz-footer"><div><div class="hearts" title="Återstående hjärtan">${'♥'.repeat(s.hearts)}<span style="opacity:.25">${'♥'.repeat(4-s.hearts)}</span></div><small class="muted">${s.correct} rätt · ${s.runXp} XP denna omgång</small></div>${s.answered?`<button class="btn" data-action="nextquestion">${s.index+1===s.questions.length||s.hearts<=0?'Se resultat':'Nästa fråga →'}</button>`:`<span class="muted" style="font-size:11px">${q.type==='builder'?'Ordna delarna och kontrollera':'Välj ett av fyra alternativ'}</span>`}</div></div></div>`}
function grade(answerIndex){const s=ui.session;if(!s||s.answered)return;const q=s.questions[s.index];let correct=q.type==='builder'?q.tiles.every((t,i)=>s.tilesChosen[i]!=null&&q.tiles[s.tilesChosen[i]].id===i):answerIndex===q.answer;s.answered=true;s.selected=answerIndex;s.history.push({id:idFor(q.verse),correct});state.total++;if(correct){s.correct++;s.streak++;state.correct++;let xp=15+Math.min(s.streak,5)*2;s.runXp+=xp;state.xp+=xp}else{s.streak=0;s.hearts=Math.max(0,s.hearts-1)}save();render()}
function nextQuestion(){const s=ui.session;if(!s||!s.answered)return;if(s.index+1>=s.questions.length||s.hearts<=0){completeSession();return}s.index++;s.answered=false;s.selected=null;s.tilesChosen=[];render();scrollTo(0,0)}
function completeSession(){let s=ui.session;if(!s)return;state.runs++;let passed=s.correct>=Math.ceil(s.questions.length*.7);if(passed){state.xp+=35;s.runXp+=35;if(s.mode==='mission')state.completed[s.id]=true;if(s.mode==='daily')state.dailyDone=today()}if(s.mode==='mission'||s.mode==='daily'){let key=s.id;state.best[key]=Math.max(state.best[key]||0,s.correct)}const day=today();if(state.lastDay!==day){state.streak=state.lastDay===previousDay(day)?state.streak+1:1;state.lastDay=day}ui.lastSession={...s,passed};ui.session=null;ui.view='summary';save();render();scrollTo(0,0)}
function summary(){let s=ui.lastSession;if(!s)return home();return `<section class="summary"><div class="summary-medal">${s.passed?'✺':'✧'}</div><div class="eyebrow">ETAPPEN ÄR AVSLUTAD</div><h1>${s.passed?'Väl genomfört!':'Bra övning!'}</h1><p class="page-lead" style="margin:0 auto">${s.passed?'Du har klarat utmaningen. Fortsätt läsa, repetera och väx i din kunskap.':'För att klara etappen behöver du minst 70 % rätt. Läs gärna bibeltexten och försök igen.'}</p><div class="summary-stats"><div><strong>${s.correct}/${s.questions.length}</strong><small>Rätta svar</small></div><div><strong>+${s.runXp}</strong><small>XP intjänade</small></div><div><strong>${s.hearts}</strong><small>Hjärtan kvar</small></div></div><div class="button-row"><button class="btn" data-action="restart">Spela igen ↻</button><button class="btn ghost" data-action="nav" data-value="journey">Alla etapper →</button><button class="btn ghost" data-action="nav" data-value="library">Läs i Bibeln</button></div></section>`}
function dueCards(){return Object.keys(state.bookmarks).filter(k=>{let r=state.review[k];return !r||!r.due||r.due<=today()}).filter(k=>!!getIdVerse(k))}
function getIdVerse(id){let [b,c,v]=id.split(':').map(Number);return findVerse(b,c,v)}
function review(){let saved=Object.keys(state.bookmarks).filter(x=>!!getIdVerse(x));let due=dueCards();if(!saved.length)return `<div class="eyebrow">✎ MINNESVERKSTADEN</div><h1>Bär med dig Ordet</h1><p class="page-lead">Spara bibelverser med stjärnan ☆ i läsaren eller efter en fråga. Här kan du träna dem med enkla intervaller och se hela originaltexten efter att du försökt minnas.</p><div class="quote-card"><h3>Din samling är tom</h3><p class="muted" style="font-size:13px">Öppna Bibeln och tryck på ☆ bredvid en vers för att lägga till ett kort.</p><button class="btn" data-action="nav" data-value="library">Utforska Bibeln →</button></div>`;if(ui.reviewId&&!getIdVerse(ui.reviewId))ui.reviewId=null;if(!ui.reviewId||(!due.includes(ui.reviewId)&&!ui.reviewShown))ui.reviewId=due[0]||saved[0];let v=getIdVerse(ui.reviewId);return `<div class="eyebrow">✎ MINNESVERKSTADEN</div><h1>Träna ditt minne</h1><p class="page-lead">${saved.length} sparade minnesverser · ${due.length} redo att övas idag. Försök återge versen för dig själv innan du vänder på kortet.</p><div class="progress-strip"><strong>${due.length?due.length+' kort att repetera':'Alla planerade repetitioner klara idag!'}</strong><span>Du avgör själv hur väl du mindes.</span></div><div class="review-card"><div class="ref">${esc(ref(v))}</div>${ui.reviewShown?`<div class="verse">${esc(v.text)}</div>${footnoteHTML(v)}`:`<div class="verse">Kan du återge den här versen ur minnet?</div>`}<div class="hint">${ui.reviewShown?'Originaltext ur Reformationsbibeln 2016':'Vänd för att jämföra med den exakta texten'}</div></div><div class="review-actions">${ui.reviewShown?`<button class="btn ghost" data-action="reviewrate" data-value="0">Behöver öva</button><button class="btn ghost" data-action="reviewrate" data-value="1">Nästan rätt</button><button class="btn" data-action="reviewrate" data-value="2">Kunde den!</button>`:`<button class="btn" data-action="flip">Visa versen →</button>`}</div><div class="section-head"><h2>Min samling</h2><button class="link-btn" data-action="nav" data-value="library">Lägg till fler →</button></div><div class="mission-grid">${saved.slice(0,18).map(id=>{let x=getIdVerse(id);return `<div class="result-card"><div class="cite">${esc(ref(x))}</div><p>${esc(x.text.length>130?x.text.slice(0,130)+'…':x.text)}</p><button class="link-btn" data-action="reviewselect" data-value="${id}">Öva</button><button class="link-btn" data-action="bookmark" data-value="${id}">Ta bort</button></div>`}).join('')}</div>`}
function rateReview(n){let k=ui.reviewId;if(!k)return;let p=state.review[k]||{interval:0,successes:0};let days=n===0?1:n===1?3:clamp((p.interval||1)*2,3,60);let date=new Date();date.setDate(date.getDate()+days);state.review[k]={interval:days,successes:(p.successes||0)+(n===2?1:0),due:date.toLocaleDateString('sv-SE')};state.xp+=n===2?9:4;ui.reviewShown=false;ui.reviewId=null;save();render()}
const ACHIEVEMENTS=[{icon:'✦',name:'Första steget',description:'Slutför din första spelomgång.',check:()=>state.runs>=1},{icon:'♛',name:'Vägvisare',description:'Klara fem etapper.',check:()=>Object.keys(state.completed).length>=5},{icon:'✺',name:'Genom hela resan',description:'Klara alla 25 etapper.',check:()=>Object.keys(state.completed).length>=MISSIONS.length},{icon:'✧',name:'Ljusbärare',description:'Samla 500 XP.',check:()=>state.xp>=500},{icon:'❦',name:'Skriftvårdare',description:'Spara tio minnesverser.',check:()=>Object.keys(state.bookmarks).length>=10},{icon:'☀',name:'Trofast vana',description:'Spela under sju dagar i följd.',check:()=>state.streak>=7},{icon:'▥',name:'Fördjupning',description:'Besvara minst 100 frågor.',check:()=>state.total>=100},{icon:'✝',name:'Noggrann läsare',description:'Få minst 50 rätta svar.',check:()=>state.correct>=50},{icon:'♢',name:'Växande kunskap',description:'Samla 2 000 XP.',check:()=>state.xp>=2000}];
function achievements(){let earned=ACHIEVEMENTS.filter(x=>x.check()).length;return `<div class="eyebrow">♜ UTMÄRKELSER</div><h1>Din växande kunskap</h1><p class="page-lead">Följ dina studievanor, fira dina framsteg och fortsätt upptäcka Bibeln i din egen takt.</p><div class="progress-strip"><strong>${earned} av ${ACHIEVEMENTS.length} utmärkelser upplåsta</strong><span>${state.total} besvarade frågor · ${state.correct} korrekta</span></div><div class="achievement-grid">${ACHIEVEMENTS.map(a=>`<div class="achievement ${a.check()?'earned':''}"><div class="a-icon">${a.icon}</div><strong>${a.check()?'✓ ':''}${esc(a.name)}</strong><p>${esc(a.description)}</p></div>`).join('')}</div>`}
function showError(){return `<div class="loading"><div class="brand-mark">✝</div><h1>Källtexten kunde inte läsas in</h1><div class="error-box">${esc(ui.error||'Ett okänt fel inträffade.')}</div><p class="muted" style="max-width:550px">Spelet använder enbart Reformationsbibeln 2016. Det visas inga ersättningstexter eller fabricerade citat om källfilen saknas.</p><div class="upload"><label for="json-upload">Välj <strong>reformationsbibeln.json</strong> från Koino-codex:</label><p><input type="file" id="json-upload" accept=".json,application/json" /></p></div><button class="btn" data-action="retry">Försök hämta igen</button><a href="${SOURCE_LINK}" target="_blank" rel="noopener noreferrer">Öppna originalfilen på GitHub</a></div>`}
function render(){if(ui.loading)return; if(ui.error){el().innerHTML=showError();return}const body={home,journey,library,review,achievements,lesson,play:game,summary}[ui.view]?.()||home();el().innerHTML=chrome(body)}
function selectChapter(delta){let b=ui.book,c=ui.chapter+delta;if(c<1){b--;if(b<1)return;c=books[b-1].chapters.length}else if(c>books[b-1].chapters.length){b++;if(b>66)return;c=1}ui.book=b;ui.chapter=c;render();scrollTo(0,0)}
function search(){let q=document.getElementById('verse-search')?.value?.trim();if(!q){ui.searchResults=null;render();return}let normalized=q.toLocaleLowerCase('sv');let matches=[],total=0;for(let v of all){if(v.text.toLocaleLowerCase('sv').includes(normalized)){total++;if(matches.length<40)matches.push(v)}}ui.searchResults={matches,total};render()}
function bookmark(k){if(state.bookmarks[k]){delete state.bookmarks[k];delete state.review[k]}else{if(!getIdVerse(k))return;state.bookmarks[k]=true}save();render()}
function handleAction(action,value){switch(action){case 'nav':navigate(value);break;case 'mission':openLesson(value);break;case 'lessonstart':startSession('mission',ui.lessonId);break;case 'lessonread':{let m=MISSIONS.find(x=>x.id===ui.lessonId);if(m){let ref=m.scope.flatMap(([b,cs])=>cs.map(c=>({b,c})))[ui.lessonChapterIndex]||{b:1,c:1};ui.book=ref.b;ui.chapter=ref.c;navigate('library')}break;}case 'daily':daily();break;case 'filter':ui.filter=value;render();break;case 'bookquiz':startSession('book',String(ui.book));break;case 'answer':grade(Number(value));break;case 'nextquestion':nextQuestion();break;case 'quit':ui.session=null;navigate('journey');break;case 'restart':if(ui.lastSession)startSession(ui.lastSession.mode,ui.lastSession.id);break;case 'build':if(ui.session&&!ui.session.answered&&!ui.session.tilesChosen.includes(Number(value))){ui.session.tilesChosen.push(Number(value));render()}break;case 'unbuild':if(ui.session&&!ui.session.answered){ui.session.tilesChosen=ui.session.tilesChosen.filter(x=>x!==Number(value));render()}break;case 'resetbuild':if(ui.session){ui.session.tilesChosen=[];render()}break;case 'checkbuild':if(ui.session?.tilesChosen.length===ui.session.questions[ui.session.index].tiles.length)grade(null);break;case 'bookmark':bookmark(value);break;case 'prevchapter':selectChapter(-1);break;case 'nextchapter':selectChapter(1);break;case 'search':search();break;case 'clearsearch':ui.searchResults=null;render();break;case 'jump':{let [b,c,v]=value.split(':').map(Number);ui.book=b;ui.chapter=c;ui.searchResults=null;render();document.getElementById('verse-'+v)?.scrollIntoView({block:'center'});break}case 'flip':ui.reviewShown=true;render();break;case 'reviewrate':rateReview(Number(value));break;case 'reviewselect':ui.reviewId=value;ui.reviewShown=false;render();break;case 'retry':ui.loading=true;ui.error=null;el().innerHTML='<div class="loading"><div class="loader"></div><p>Hämtar källtexten …</p></div>';loadBible();break}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;handleAction(b.dataset.action,b.dataset.value)});
document.addEventListener('change',async e=>{let t=e.target;if(t.id==='book-picker'){ui.book=Number(t.value);ui.chapter=1;ui.searchResults=null;render()}else if(t.id==='chapter-picker'){ui.chapter=Number(t.value);render()}else if(t.id==='lessonchapter'){ui.lessonChapterIndex=Number(t.value);render()}else if(t.id==='json-upload'){let file=t.files?.[0];if(!file)return;try{installBible(JSON.parse(await file.text()))}catch(err){ui.error=String(err.message||err);render()}}});
document.addEventListener('keydown',e=>{if(e.target?.matches('input,textarea,select')){if(e.key==='Enter'&&e.target.id==='verse-search')search();return}if(ui.view==='play'&&ui.session){if(!ui.session.answered&&/[1-4]/.test(e.key)&&e.key.length===1&&ui.session.questions[ui.session.index].type!=='builder')grade(Number(e.key)-1);if(e.key==='Enter'&&ui.session.answered)nextQuestion()}});
loadBible();
</script>
